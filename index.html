<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рутина — дії</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    padding: 16px;
  }
  .wrap { display: flex; gap: 14px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 200px; position: relative;
    display: flex; align-items: center; gap: 14px;
    padding: 18px 20px; border-radius: 16px; border: none; cursor: pointer;
    color: #fff; text-align: left; font-family: inherit; overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,0.18); }
  .btn:active:not(:disabled) { transform: translateY(0px) scale(0.98); }
  .btn:disabled { opacity: 0.55; cursor: default; transform: none; }
  .btn-month { background: linear-gradient(135deg, #6a5cff 0%, #8a3ffc 100%); }
  .btn-report { background: linear-gradient(135deg, #00c896 0%, #00a37a 100%); }
  .icon {
    width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.22);
    display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
  }
  .label { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }
  .spinner {
    width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.4);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite;
    position: absolute; right: 16px; display: none;
  }
  .btn.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status {
    margin-top: 14px; font-size: 13px; font-weight: 600; min-height: 20px;
    display: flex; align-items: center; gap: 6px; transition: opacity 0.2s ease; opacity: 0;
  }
  #status.show { opacity: 1; }
  #status.ok { color: #00a37a; }
  #status.err { color: #e5484d; }
  #status.missing { color: #e5484d; }
</style>
</head>
<body>

<div class="wrap">
  <button class="btn btn-month" id="btn-month">
    <span class="icon">🗓️</span>
    <span>
      <div class="label">Створити місяць</div>
      <div class="sub">Розгортає структуру тижнів</div>
    </span>
    <span class="spinner"></span>
  </button>

  <button class="btn btn-report" id="btn-report">
    <span class="icon">🧾</span>
    <span>
      <div class="label">Згенерувати звіт</div>
      <div class="sub">AI-підсумок поточного тижня</div>
    </span>
    <span class="spinner"></span>
  </button>
</div>
<div id="status"></div>

<script>
  // Fine-grained GitHub PAT, scoped ONLY to this one repo, "Actions: Read and write" permission.
  // Generate at: https://github.com/settings/personal-access-tokens/new
  //   Repository access → Only select repositories → Kaate3/notion-routine
  //   Permissions → Actions → Read and write (nothing else needed)
  // This token is visible to anyone who views this page's source — that's why its scope
  // is limited to just triggering workflow runs on this one repo, nothing more.
  const GITHUB_TOKEN = "ВСТАВ_СЮДИ_СВІЙ_ТОКЕН";
  const REPO = "Kaate3/notion-routine";

  const params = new URLSearchParams(window.location.search);
  const pageId = params.get("page_id");

  const statusEl = document.getElementById("status");
  const monthBtn = document.getElementById("btn-month");
  const reportBtn = document.getElementById("btn-report");

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = "show " + cls;
  }

  if (!pageId) {
    setStatus("⚠️ У посиланні бракує ?page_id=... — зверніться до адміністратора", "missing");
    monthBtn.disabled = true;
    reportBtn.disabled = true;
  }

  async function trigger(task, btn, otherBtn, label) {
    btn.disabled = true;
    otherBtn.disabled = true;
    btn.classList.add("loading");
    setStatus(`Запускаю: ${label}...`, "");

    const eventType = task === "month" ? "notion-month-setup" : "notion-week-report";

    try {
      const res = await fetch(`https://api.github.com/repos/${REPO}/dispatches`, {
        method: "POST",
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${GITHUB_TOKEN}`,
          "X-GitHub-Api-Version": "2022-11-28",
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ event_type: eventType, client_payload: { page_id: pageId } }),
      });

      if (res.status === 204) {
        setStatus("✅ Готово! Перевір картку за кілька хвилин", "ok");
      } else {
        setStatus(`⚠️ Помилка (${res.status}). Онови чекбокс "${label}" на картці вручну — автоматика підхопить його протягом 15 хв`, "err");
      }
    } catch (e) {
      setStatus(`⚠️ Не вдалося з'єднатись. Онови чекбокс "${label}" на картці вручну — автоматика підхопить його протягом 15 хв`, "err");
    } finally {
      btn.classList.remove("loading");
      setTimeout(() => {
        btn.disabled = false;
        otherBtn.disabled = false;
      }, 3000);
    }
  }

  monthBtn.addEventListener("click", () => trigger("month", monthBtn, reportBtn, "Створити місяць"));
  reportBtn.addEventListener("click", () => trigger("report", reportBtn, monthBtn, "Згенерувати звіт"));
</script>

</body>
</html>
